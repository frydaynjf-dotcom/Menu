<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو فراي دي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&amp;family=Baloo+Bhaijaan+2:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf7ec; --bg2:#f1e9d2; --ink:#141414; --muted:#55524a; --line:#141414;
  --yellow:#ffe11a; --blue:#2a86e0; --flame:#ff7518; --panel:#fbf7ec; --card:#ffffff; --shadow:#141414;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10213a; --bg2:#08142a; --ink:#fdf6e3; --muted:#b9c3d6; --line:#050a14;
    --panel:#0d1c33; --card:#16294a; --shadow:#030810; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10213a; --bg2:#08142a; --ink:#fdf6e3; --muted:#b9c3d6; --line:#050a14;
  --panel:#0d1c33; --card:#16294a; --shadow:#030810; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;
  font-family:"Baloo Bhaijaan 2","Tajawal",system-ui,Tahoma,sans-serif;color:var(--ink);
  background:
    radial-gradient(circle,color-mix(in srgb,var(--ink) 9%,transparent) 1.2px,transparent 1.6px) 0 0/22px 22px,
    radial-gradient(120% 80% at 50% 0%,var(--bg) 0%,var(--bg2) 100%);
}
header{padding:14px 16px 4px;display:flex;flex-direction:column;align-items:center;gap:6px}
.logo{
  background:#fff;border:3px solid #141414;border-radius:26px 30px 24px 32px;
  box-shadow:5px 6px 0 var(--shadow);padding:6px 14px;transform:rotate(-2deg)
}
.logo img{display:block;height:clamp(60px,10vh,104px);width:auto}
.tabs{display:flex;gap:8px;margin-top:6px}
.tabs button{font:inherit;font-weight:800;font-size:1rem;color:#141414;background:#fff;border:2.5px solid #141414;border-radius:999px;
  padding:3px 16px;box-shadow:3px 3px 0 var(--shadow);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--yellow);transform:rotate(-2deg)}
.tabs button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.tabs button:focus-visible{outline:4px solid var(--flame);outline-offset:2px}
@keyframes pop{from{opacity:0}}
.bubble{animation:pop .4s ease-out}
.en{display:block;direction:ltr;text-align:right;color:var(--muted);font-size:.82rem;font-weight:700;margin-bottom:2px}
.item.off{opacity:.55}
.item.off .price{text-decoration:line-through}
.offtag{display:inline-block;margin-inline-start:8px;font-size:.8rem;font-weight:800;color:#fff;background:#d6402b;border-radius:999px;padding:0 8px}
.phero .en{text-align:center;color:#141414;opacity:.7;font-size:.95rem;margin:0}
header p{margin:4px 0 0;color:var(--muted);font-size:.95rem;font-weight:700}

#stage{position:relative;flex:1;overflow:hidden;touch-action:none}
.bubble{
  position:absolute;top:0;left:0;border-radius:50%;padding:0;cursor:pointer;
  background:
    radial-gradient(circle at 30% 24%,rgba(255,255,255,.55),rgba(255,255,255,0) 30%),
    var(--c);
  border:3px solid #141414;
  box-shadow:inset -8px -10px 0 rgba(0,0,0,.12),5px 6px 0 var(--shadow);
  display:grid;place-items:center;overflow:hidden;will-change:transform;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
}
.bubble:focus-visible{outline:4px solid var(--flame);outline-offset:5px}
.bubble img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.bubble .emo{font-size:calc(var(--r) * .74);line-height:1;transform:translateY(-14%) rotate(-6deg);pointer-events:none}
.bubble .lbl{
  position:absolute;left:50%;bottom:calc(var(--r) * .16);transform:translateX(-50%) rotate(-3deg);white-space:normal;width:max-content;max-width:88%;text-align:center;
  font-family:"Lalezar","Baloo Bhaijaan 2",sans-serif;font-weight:400;
  font-size:clamp(.85rem,calc(var(--r) * .23),1.25rem);line-height:1.3;color:#141414;pointer-events:none;
  background:#fff;border:2px solid #141414;border-radius:14px;padding:2px 9px 0;
}
.bubble.dragging{cursor:grabbing;z-index:5}

#panel{
  position:fixed;inset:0;z-index:20;background:var(--panel);overflow-y:auto;
  clip-path:circle(var(--cr,0px) at var(--cx,50%) var(--cy,50%));
  transition:clip-path .6s cubic-bezier(.7,0,.2,1);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
#panel.open{clip-path:circle(150vmax at var(--cx,50%) var(--cy,50%))}
#panel[hidden]{display:none}
.phero{background:var(--c);color:#141414;padding:14px 20px 34px;border-bottom:3px solid #141414;
  border-radius:0 0 46% 46% / 0 0 34px 34px;text-align:center}
.pbar{display:flex;justify-content:flex-start}
.back{
  display:inline-flex;align-items:center;gap:6px;font:inherit;font-weight:800;color:#141414;
  background:#fff;border:2.5px solid #141414;border-radius:999px;padding:6px 14px 6px 16px;cursor:pointer;
  box-shadow:3px 3px 0 #141414
}
.back:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #141414}
.back:focus-visible{outline:4px solid var(--flame);outline-offset:2px}
.pthumb{width:124px;height:124px;border-radius:50%;margin:10px auto 8px;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.6),rgba(255,255,255,0) 32%),rgba(255,255,255,.25);
  border:3px solid #141414;box-shadow:5px 6px 0 #141414}
.pthumb img{width:100%;height:100%;object-fit:cover}
.pthumb span{font-size:4.3rem}
.phero h2{font-family:"Lalezar",sans-serif;font-weight:400;font-size:2.5rem;margin:0;line-height:1.2}
.phero small{font-weight:700;font-size:.95rem}

.items{list-style:none;margin:0 auto;padding:24px 16px 40px;max-width:900px;display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:700px){.items{grid-template-columns:1fr 1fr}}
.item{display:flex;gap:14px;align-items:center;background:var(--card);border:2.5px solid var(--line);
  border-radius:22px 60px 60px 22px;padding:10px 10px 10px 16px;box-shadow:4px 5px 0 var(--shadow)}
.ithumb{flex:none;width:80px;height:80px;border-radius:50%;overflow:hidden;display:grid;place-items:center;
  background:var(--c);border:2.5px solid #141414}
.ithumb img{width:100%;height:100%;object-fit:cover}
.ithumb span{font-size:2.5rem}
.item h3{margin:0 0 2px;font-size:1.12rem;font-weight:800}
.item p{margin:0 0 6px;color:var(--muted);font-size:.92rem;line-height:1.5}
.price{display:inline-block;font-weight:800;background:var(--yellow);color:#141414;border:2px solid #141414;border-radius:999px;padding:0 10px;transform:rotate(-2deg)}

@media (prefers-reduced-motion:reduce){#panel{transition:none}}

/* ================== 🎮 لعبة: وين الصنف؟ ================== */
.gfab{
  position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:10;
  display:flex;align-items:center;gap:8px;font:inherit;font-weight:800;font-size:1.15rem;color:#141414;
  background:var(--yellow);border:3px solid #141414;border-radius:999px;padding:6px 18px 6px 10px;
  box-shadow:4px 5px 0 var(--shadow);cursor:pointer;transform:rotate(-3deg)
}
.gfab span{font-size:1.6rem;line-height:1}
.gfab:active{transform:rotate(-3deg) translate(2px,2px);box-shadow:2px 2px 0 var(--shadow)}
.gfab:focus-visible,.gx:focus-visible,.gbtn:focus-visible,.gb:focus-visible{outline:4px solid var(--flame);outline-offset:3px}

#game{
  position:fixed;inset:0;z-index:30;display:none;flex-direction:column;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  background:
    radial-gradient(circle,color-mix(in srgb,var(--ink) 9%,transparent) 1.2px,transparent 1.6px) 0 0/22px 22px,
    radial-gradient(120% 80% at 50% 0%,var(--bg) 0%,var(--bg2) 100%);
  background-color:var(--bg2);
}
#game.on{display:flex}
.ghud{display:flex;align-items:center;gap:8px;padding:12px 14px 0}
.ghud .sp{flex:1}
.gpill{font-weight:800;background:#fff;color:#141414;border:2.5px solid #141414;border-radius:999px;
  padding:2px 14px;box-shadow:3px 3px 0 var(--shadow);font-size:1rem;white-space:nowrap}
.gpill b{font-size:1.3rem}
.gpill.hot{background:var(--flame)}
.gx{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:inherit;font-size:1.15rem;font-weight:800;
  color:#141414;background:#fff;border:2.5px solid #141414;box-shadow:3px 3px 0 var(--shadow);cursor:pointer}
.gx:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.gtarget{
  margin:14px auto 4px;min-width:200px;text-align:center;color:#141414;background:var(--tc,#fff);
  border:3px solid #141414;border-radius:22px 30px 20px 32px;box-shadow:5px 6px 0 var(--shadow);
  padding:4px 24px 6px;transform:rotate(-2deg)
}
.gtarget small{display:block;font-weight:800;font-size:.9rem}
.gtarget strong{display:block;font-family:"Lalezar",sans-serif;font-weight:400;font-size:clamp(1.9rem,8vw,2.6rem);line-height:1.25}
.gtarget .en{text-align:center;color:#141414;opacity:.7;margin:0}
.gtarget.flip{animation:gflip .35s ease-out}
@keyframes gflip{from{transform:rotate(-8deg) scale(1.25)}}
#gfield{position:relative;flex:1;overflow:hidden;touch-action:none}
.gb{
  position:absolute;top:0;left:0;padding:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.55),rgba(255,255,255,0) 30%),var(--c);
  border:3px solid #141414;box-shadow:inset -6px -8px 0 rgba(0,0,0,.12),4px 5px 0 var(--shadow);
  will-change:transform;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none
}
.gb span{font-size:calc(var(--d) * .52);line-height:1;pointer-events:none}
.gb.gold{border-color:var(--yellow);box-shadow:0 0 0 3px #141414,0 0 22px var(--flame),4px 5px 0 var(--shadow)}
.gb.wrong span{animation:gshake .35s}
@keyframes gshake{25%{transform:translateX(-7px) rotate(-12deg)}75%{transform:translateX(7px) rotate(12deg)}}
.gfloat{position:absolute;z-index:4;pointer-events:none;font-family:"Lalezar",sans-serif;font-size:1.5rem;line-height:1.3;
  color:#141414;background:var(--yellow);border:2.5px solid #141414;border-radius:999px;padding:0 12px;
  animation:gup .8s ease-out forwards;white-space:nowrap}
.gfloat.neg{background:#ff6b3d;color:#fff}
.gfloat.gold{background:var(--flame);font-size:1.9rem}
@keyframes gup{to{transform:translateY(-64px) rotate(-6deg);opacity:0}}
.gspark{position:absolute;width:10px;height:10px;border-radius:50%;border:2px solid #141414;pointer-events:none;animation:gsp .5s ease-out forwards}
@keyframes gsp{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.gcover{position:absolute;inset:0;z-index:6;display:grid;place-items:center;padding:20px;background:rgba(10,10,10,.28)}
.gcover[hidden]{display:none}
.gcard{background:var(--card);color:var(--ink);border:3px solid #141414;border-radius:28px 34px 26px 36px;
  box-shadow:6px 7px 0 var(--shadow);padding:22px 20px;max-width:360px;width:100%;text-align:center}
.gcard h2{font-family:"Lalezar",sans-serif;font-weight:400;font-size:2.5rem;margin:0;line-height:1.2}
.gcard p{margin:6px 0;color:var(--muted);font-weight:700;line-height:1.6}
.grules{list-style:none;margin:14px 0;padding:0;display:grid;gap:8px;text-align:right}
.grules li{display:flex;align-items:center;gap:10px;font-weight:800}
.grules li span{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:1.3rem;
  border:2.5px solid #141414;background:var(--yellow)}
.gbig{font-family:"Lalezar",sans-serif;font-size:5rem;line-height:1;margin:6px 0}
.greward{background:var(--yellow);color:#141414;border:2.5px dashed #141414;border-radius:18px;padding:10px;font-weight:800;margin-top:10px;transform:rotate(-1.5deg)}
.gbtns{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.gbtn{font:inherit;font-weight:800;font-size:1.2rem;color:#141414;background:var(--flame);border:3px solid #141414;border-radius:999px;
  padding:6px;cursor:pointer;box-shadow:4px 4px 0 var(--shadow)}
.gbtn.alt{background:#fff}
.gbtn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--shadow)}
.gcount{font-family:"Lalezar",sans-serif;font-size:8rem;line-height:1;color:var(--yellow);
  -webkit-text-stroke:3px #141414;text-shadow:6px 7px 0 #141414;animation:gcnt .65s ease-out}
@keyframes gcnt{from{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){.gtarget.flip,.gcount{animation:none}}

/* ================== ✏️ لوحة التعديل ================== */
header{position:relative}
.admbtn{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  font-size:1.15rem;color:#141414;background:#fff;border:2.5px solid #141414;box-shadow:3px 3px 0 var(--shadow);cursor:pointer;opacity:.85}
.admbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.admbtn:focus-visible{outline:4px solid var(--flame);outline-offset:2px}
.pinbox{position:fixed;inset:0;z-index:45;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.45)}
.pinbox[hidden]{display:none}
.pincard{width:100%;max-width:320px;background:var(--card);color:var(--ink);border:3px solid #141414;border-radius:24px 30px 22px 32px;
  box-shadow:6px 7px 0 var(--shadow);padding:20px;text-align:center}
.pincard h2{margin:0 0 4px;font-family:"Lalezar",sans-serif;font-weight:400;font-size:2rem}
.pincard p{margin:0 0 12px;color:var(--muted);font-weight:700}
.pincard input{box-sizing:border-box;width:100%;font:inherit;font-size:1.4rem;font-weight:800;text-align:center;letter-spacing:.2em;
  color:var(--ink);background:var(--bg);border:2.5px solid #141414;border-radius:14px;padding:6px}
.pincard input:focus{outline:3px solid var(--flame)}
.pincard .err{color:#d6402b;font-weight:800;min-height:1.6em;margin:6px 0 0}
.pincard .row{display:flex;gap:10px;margin-top:10px}
.pincard .row .abtn{flex:1;font-size:1.05rem;padding:6px}
.pinshake{animation:gshake .35s}
.logo img{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
#admin{position:fixed;inset:0;z-index:40;overflow-y:auto;background:var(--bg);color:var(--ink);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#admin[hidden]{display:none}
.abar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);border-bottom:3px solid #141414}
.abar h2{flex:1;margin:0;font-family:"Lalezar",sans-serif;font-weight:400;font-size:1.7rem;line-height:1.2}
.abtn{font:inherit;font-weight:800;font-size:.95rem;color:#141414;background:#fff;border:2.5px solid #141414;border-radius:999px;
  padding:4px 14px;box-shadow:3px 3px 0 var(--shadow);cursor:pointer;white-space:nowrap}
.abtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.abtn:focus-visible{outline:4px solid var(--flame);outline-offset:2px}
.abtn.primary{background:var(--yellow)}
.abtn.danger{background:#ff6b3d;color:#fff}
.abtn.sm{padding:1px 10px;font-size:.85rem;box-shadow:2px 2px 0 var(--shadow)}
.ainfo{max-width:820px;margin:12px auto 0;padding:0 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-weight:700;color:var(--muted)}
.ainfo b{color:var(--ink)}
.ainfo .warn{color:#d6402b}
.ainfo .ok{color:#2f9e6a}
.abody{max-width:820px;margin:0 auto;padding:12px 14px 90px;display:grid;gap:14px}
.acard,.acat{background:var(--card);border:2.5px solid var(--line);border-radius:20px;box-shadow:4px 5px 0 var(--shadow);padding:12px}
.acard h3{margin:0 0 8px;font-size:1.05rem}
.acat > summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer}
.acat > summary::-webkit-details-marker{display:none}
.acat[open] > summary{padding-bottom:10px;border-bottom:2px dashed var(--line)}
.athumb{flex:none;width:56px;height:56px;border-radius:50%;border:2.5px solid #141414;background:var(--c,#fff);
  display:grid;place-items:center;overflow:hidden;font-size:1.8rem}
.athumb img{width:100%;height:100%;object-fit:cover}
.athumb.logo{width:auto;height:70px;border-radius:14px;padding:4px 10px;background:#fff}
.athumb.logo img{width:auto;height:58px;max-width:200px;object-fit:contain}
.aname{flex:1;min-width:0;font-weight:800;font-size:1.1rem;line-height:1.3}
.aname small{display:block;color:var(--muted);font-size:.85rem}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.afields > *{min-width:0}
#admin{overflow-x:hidden}
#admin *,#admin *::before,#admin *::after{box-sizing:border-box}
.abody > *{min-width:0}
.afields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:12px}
.afields label{display:flex;flex-direction:column;gap:3px;font-weight:800;font-size:.85rem;color:var(--muted)}
.afields .full{grid-column:1/-1}
.afields input,.afields select,.afields textarea{font:inherit;font-size:1rem;font-weight:700;color:var(--ink);background:var(--bg);
  border:2px solid color-mix(in srgb,var(--ink) 35%,transparent);border-radius:12px;padding:5px 10px;min-width:0;width:100%}
.afields textarea{resize:vertical;min-height:2.6em}
.afields input:focus,.afields select:focus,.afields textarea:focus{outline:3px solid var(--flame);outline-offset:1px}
.afields input[type=color]{height:40px;padding:2px 4px}
.afields input[dir=ltr]{text-align:left}
.afields label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.afields label.chk input{width:22px;height:22px}
.aimg{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.aimg small{color:var(--muted);font-weight:700}
.aitems{display:grid;gap:10px;margin-top:14px}
.aitem{border:2px dashed color-mix(in srgb,var(--ink) 30%,transparent);border-radius:16px;padding:10px}
.aitem .ahead{display:flex;align-items:center;gap:10px}
.aitem .athumb{width:48px;height:48px;font-size:1.5rem}
.aitem.off{opacity:.7}
.atabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.atabs button{font:inherit;font-weight:800;font-size:1rem;color:#141414;background:#fff;border:2.5px solid #141414;border-radius:999px;
  padding:3px 16px;box-shadow:3px 3px 0 var(--shadow);cursor:pointer}
.atabs button[aria-pressed="true"]{background:var(--yellow);transform:rotate(-2deg)}
.abusy{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(0,0,0,.35);color:#fff;font-weight:800;font-size:1.2rem}
.abusy[hidden]{display:none}
@media (max-width:420px){.abar h2{font-size:1.35rem}}
</style>
</head>
<body>
<header>
  <button class="admbtn" id="admbtn" type="button" aria-label="دخول الإدارة">⚙️</button>
  <h1 class="logo" style="margin:0"><img alt="FRY DAY — Fries &amp; Pastry"></h1>
  <nav class="tabs" aria-label="أقسام المنيو">
    <button type="button" data-g="food" aria-pressed="true">الأكل</button>
    <button type="button" data-g="drinks" aria-pressed="false">المشروبات</button>
    <button type="button" data-g="sweets" aria-pressed="false">الحلويات</button>
  </nav>
  <p>اضغط على الصنف، أو اسحب الدوائر وارمها</p>
</header>
<main id="stage" aria-label="أصناف المنيو"></main>
<section id="panel" hidden="" aria-modal="true" role="dialog"></section>

<button class="gfab" id="gfab" type="button"><span aria-hidden="true">🎮</span>العب</button>
<section id="game" role="dialog" aria-modal="true" aria-label="لعبة وين الصنف">

   img: مسار صورة الصنف أو الطبق (فارغ = تظهر الأيقونة)
   off: true = غير متوفر حالياً                          */
const ORIGINAL_JSON = document.getElementById('menu-data').textContent;
const DATA_SIG = (s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0; return h.toString(36) + '-' + s.length; })(ORIGINAL_JSON);
const DRAFT_KEY = 'fryday_menu_draft';
let DATA = JSON.parse(ORIGINAL_JSON);
try {
  const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
  if (d && d.base === DATA_SIG && d.data && d.data.cats){ DATA = d.data; window.__draftUsed = true; }
  else if (d) localStorage.removeItem(DRAFT_KEY);
} catch (e) {}
let CATS = DATA.cats;
function applyLogo(){ const im = document.querySelector('.logo img'); if (im) im.src = DATA.logo || ''; }
applyLogo();
let group = 'food';
const visible = () => CATS.filter(c => c.group === group);
const CURRENCY = 'د.ع';

/* ================== floating physics ================== */
const stage = document.getElementById('stage');
const panel = document.getElementById('panel');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W = 0, H = 0, bubbles = [], paused = false;

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n.toLocaleString('en-US') + ' ' + CURRENCY;
const media = (img, emoji, alt) => img ? `<img src="${esc(img)}" alt="${esc(alt)}" loading="lazy">` : `<span aria-hidden="true">${emoji}</span>`;

function sizes(){
  const r = stage.getBoundingClientRect(); W = r.width; H = r.height;
  const ws = visible().map((c,i) => 0.82 + ((i * 37) % 9) / 22);
  const sum = ws.reduce((a,w) => a + w*w, 0);
  const s = Math.sqrt(0.5 * W * H / (Math.PI * sum));
  return ws.map(w => Math.max(40, Math.min(125, s * w)));
}

function build(){
  stage.innerHTML = ''; bubbles = [];
  const radii = sizes();
  visible().forEach((c, i) => {
    const r = radii[i];
    const el = document.createElement('button');
    el.className = 'bubble'; el.type = 'button';
    el.setAttribute('aria-label', c.name);
    el.style.cssText = `width:${2*r}px;height:${2*r}px;--r:${r}px;--c:${c.color}`;
    el.innerHTML = (c.img ? `<img src="${esc(c.img)}" alt="">` : `<span class="emo">${c.emoji}</span>`) + `<span class="lbl" style="font-size:clamp(.72rem,calc(var(--r) * ${c.name.length > 6 ? .19 : .24}),1.25rem)">${esc(c.name)}</span>`;
    const ang = Math.random() * Math.PI * 2;
    const b = {c, el, r, x: r + Math.random() * Math.max(1, W - 2*r), y: r + Math.random() * Math.max(1, H - 2*r),
               vx: Math.cos(ang) * .35, vy: Math.sin(ang) * .35, ph: Math.random() * 6.28, drag: null, suppress: false};
    bindDrag(b);
    stage.appendChild(el); bubbles.push(b);
  });
  for (let k = 0; k < 200; k++) collide();
  render();
}

function collide(){
  for (let i = 0; i < bubbles.length; i++){
    const a = bubbles[i];
    for (let j = i + 1; j < bubbles.length; j++){
      const b = bubbles[j];
      let dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || .01;
      const min = a.r + b.r + 8;
      if (d < min){
        const nx = dx / d, ny = dy / d, ov = (min - d);
        const ma = a.r*a.r, mb = b.r*b.r, t = ma + mb;
        if (!a.drag){ a.x -= nx * ov * mb / t; a.y -= ny * ov * mb / t; }
        if (!b.drag){ b.x += nx * ov * ma / t; b.y += ny * ov * ma / t; }
        const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (rv < 0){
          const imp = 1.8 * rv / t;
          if (!a.drag){ a.vx += imp * mb * nx; a.vy += imp * mb * ny; }
          if (!b.drag){ b.vx -= imp * ma * nx; b.vy -= imp * ma * ny; }
        }
      }
    }
  }
  for (const b of bubbles){
    if (b.x < b.r){ b.x = b.r; b.vx = Math.abs(b.vx); }
    if (b.x > W - b.r){ b.x = W - b.r; b.vx = -Math.abs(b.vx); }
    if (b.y < b.r){ b.y = b.r; b.vy = Math.abs(b.vy); }
    if (b.y > H - b.r){ b.y = H - b.r; b.vy = -Math.abs(b.vy); }
  }
}

function render(){
  for (const b of bubbles) b.el.style.transform = `translate(${b.x - b.r}px,${b.y - b.r}px)`;
}

let t = 0;
function loop(){
  if (!paused && !reduce){
    t += 1;
    for (const b of bubbles){
      if (b.drag) continue;
      b.vx += Math.sin(t * .011 + b.ph) * .006;
      b.vy += Math.cos(t * .009 + b.ph * 1.3) * .006;
      const sp = Math.hypot(b.vx, b.vy);
      if (sp > .55){ b.vx *= .975; b.vy *= .975; }
      b.x += b.vx; b.y += b.vy;
    }
    collide(); render();
  }
  requestAnimationFrame(loop);
}

function bindDrag(b){
  const el = b.el;
  el.addEventListener('pointerdown', e => {
    el.setPointerCapture(e.pointerId);
    const rect = stage.getBoundingClientRect();
    const px = e.clientX - rect.left, py = e.clientY - rect.top;
    b.drag = {ox: px - b.x, oy: py - b.y, sx: px, sy: py, lx: px, ly: py, lt: performance.now(), moved: false};
  });
  el.addEventListener('pointermove', e => {
    if (!b.drag) return;
    const rect = stage.getBoundingClientRect();
    const px = e.clientX - rect.left, py = e.clientY - rect.top, now = performance.now();
    if (Math.hypot(px - b.drag.sx, py - b.drag.sy) > 7){ b.drag.moved = true; el.classList.add('dragging'); }
    if (!b.drag.moved) return;
    const dt = Math.max(8, now - b.drag.lt) / 16;
    b.vx = (px - b.drag.lx) / dt; b.vy = (py - b.drag.ly) / dt;
    b.x = px - b.drag.ox; b.y = py - b.drag.oy;
    b.drag.lx = px; b.drag.ly = py; b.drag.lt = now;
    if (reduce){ collide(); render(); }
  });
  const end = () => {
    if (!b.drag) return;
    if (b.drag.moved){
      b.suppress = true;
      const sp = Math.hypot(b.vx, b.vy);
      if (sp > 22){ b.vx *= 22 / sp; b.vy *= 22 / sp; }
      if (reduce){ b.vx = b.vy = 0; }
    }
    b.drag = null; el.classList.remove('dragging');
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('click', () => {
    if (b.suppress){ b.suppress = false; return; }
    if (location.hash === '#' + b.c.id) route(); else location.hash = b.c.id;
  });
}

/* ================== category panel ================== */
let lastBubble = null;
function openCat(c){
  const b = bubbles.find(x => x.c === c);
  if (b){
    const r = b.el.getBoundingClientRect();
    panel.style.setProperty('--cx', (r.left + r.width/2) + 'px');
    panel.style.setProperty('--cy', (r.top + r.height/2) + 'px');
    panel.style.setProperty('--cr', (r.width/2) + 'px');
    lastBubble = b.el;
  }
  panel.style.setProperty('--c', c.color);
  const n = c.items.length;
  panel.innerHTML = `
    <div class="phero">
      <div class="pbar"><button class="back" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        الأصناف</button></div>
      <div class="pthumb">${media(c.img, c.emoji, c.name)}</div>
      <h2>${esc(c.name)}</h2>
      ${c.en ? `<p class="en">${esc(c.en)}</p>` : ''}
      <small>${n == 1 ? 'طبق واحد' : n == 2 ? 'طبقين' : n <= 10 ? n + ' أطباق' : n + ' طبق'}</small>
    </div>
    <ul class="items">${c.items.map(it => `
      <li class="item${it.off ? ' off' : ''}">
        <div class="ithumb">${media(it.img, it.emoji || c.emoji, it.name)}</div>
        <div><h3>${esc(it.name)}</h3>${it.en ? `<span class="en">${esc(it.en)}</span>` : ''}${it.desc ? `<p>${esc(it.desc)}</p>` : ''}<span class="price">${fmt(it.price)}</span>${it.off ? '<span class="offtag">غير متوفر حالياً</span>' : ''}</div>
      </li>`).join('')}
    </ul>`;
  panel.setAttribute('aria-label', c.name);
  panel.hidden = false; panel.scrollTop = 0;
  panel.querySelector('.back').addEventListener('click', () => { location.hash = ''; });
  void panel.offsetWidth;
  panel.classList.add('open');
  paused = true;
  panel.querySelector('.back').focus({preventScroll: true});
}
function closeCat(){
  if (panel.hidden) return;
  paused = false;
  panel.classList.remove('open');
  const done = () => { if (!panel.classList.contains('open')) panel.hidden = true; };
  if (reduce) done(); else panel.addEventListener('transitionend', done, {once: true});
  if (lastBubble) lastBubble.focus({preventScroll: true});
}
function route(){
  const id = location.hash.slice(1);
  const c = CATS.find(x => x.id === id);
  if (c && c.group !== group) setGroup(c.group);
  c ? openCat(c) : closeCat();
}
addEventListener('hashchange', route);
addEventListener('keydown', e => { if (e.key === 'Escape' && !panel.hidden) location.hash = ''; });

let rt;
addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    const oW = W || 1, oH = H || 1, radii = sizes();
    bubbles.forEach((b, i) => {
      b.r = radii[i]; b.x = b.x * W / oW; b.y = b.y * H / oH;
      b.el.style.width = b.el.style.height = 2 * b.r + 'px';
      b.el.style.setProperty('--r', b.r + 'px');
    });
    for (let k = 0; k < 60; k++) collide();
    render();
  }, 120);
});

const tabs = document.querySelectorAll('.tabs button');
function setGroup(g){
  group = g;
  tabs.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.g === g)));
  build();
}
tabs.forEach(b => b.addEventListener('click', () => { if (b.dataset.g !== group) setGroup(b.dataset.g); }));
build();
loop();
route();

/* ======================================================
   🎮 لعبة: وين الصنف؟ — عدّل الإعدادات هنا
   reward.score: النقاط المطلوبة للهدية (حط 0 لإلغاء الهدية)
   ====================================================== */
const GAME = {
  seconds: 45,
  reward: { score: 30, text: '🎁 كفو! وَرّي هاي الشاشة للكاشير وخذ هديتك' }
};

const $g = id => document.getElementById(id);
const gameEl = $g('game'), gfield = $g('gfield'), gcover = $g('gcover');
/* الأصناف اللي إلها أيقونة مميزة حتى ما يصير لبس بين صنفين */
const makePool = () => { const seen = new Set(); return CATS.filter(c => c.items.length && !seen.has(c.emoji) && seen.add(c.emoji)); };
let POOL = makePool();
const G = { on:false, score:0, time:GAME.seconds, combo:0, target:null, items:[], spawnT:0, force:false, last:0, timer:null, raf:null };

let gMuted = false, actx;
function beep(f = 520, d = .09, type = 'sine', v = .16){
  if (gMuted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t0); o.frequency.exponentialRampToValueAtTime(f * 1.7, t0 + d);
    g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + d);
    o.connect(g).connect(actx.destination); o.start(); o.stop(t0 + d);
  } catch (e) {}
}
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const bestScore = () => { try { return +localStorage.getItem('fryday_best') || 0; } catch (e) { return 0; } };
const saveBest = s => { try { localStorage.setItem('fryday_best', s); } catch (e) {} };
const pick = a => a[Math.floor(Math.random() * a.length)];

function hud(){
  $g('gscore').textContent = G.score;
  $g('gtime').textContent = G.time;
  $g('gcombo').textContent = G.combo;
  $g('gcomboPill').hidden = G.combo < 2;
  $g('gcomboPill').classList.toggle('hot', G.combo >= 4);
}
function newTarget(){
  let c; do { c = pick(POOL); } while (POOL.length > 1 && c === G.target);
  G.target = c; G.force = true; G.spawnT = Math.min(G.spawnT, .25);
  const t = $g('gtarget');
  t.style.setProperty('--tc', c.color);
  $g('gname').textContent = c.name;
  $g('gen').textContent = c.en || '';
  t.classList.remove('flip'); void t.offsetWidth; t.classList.add('flip');
}
function cover(html){ gcover.innerHTML = html; gcover.hidden = false; }

function intro(){
  $g('gname').textContent = '…'; $g('gen').textContent = ''; $g('gtarget').style.removeProperty('--tc');
  cover(`
    <div class="gcard">
      <h2>وين الصنف؟</h2>
      <p>يطلعلك اسم صنف من المنيو، اضغط على دائرته قبل لا تطير</p>
      <ul class="grules">
        <li><span>✅</span>الصنف الصح: نقطة، وإذا صبت ورا بعض تتضاعف لحد ×5</li>
        <li><span>❌</span>الغلط: ينقص نقطة ويصفّر العدّاد</li>
        <li><span>⭐</span>النجمة الذهبية: +5</li>
      </ul>
      <p>أعلى نتيجة: <b>${bestScore()}</b></p>
      <div class="gbtns">
        <button class="gbtn" type="button" id="gstart">ابدأ</button>
        <button class="gbtn alt" type="button" id="gback">رجوع للمنيو</button>
      </div>
    </div>`);
  $g('gstart').onclick = countdown;
  $g('gback').onclick = closeGame;
  $g('gstart').focus({preventScroll:true});
}
function countdown(){
  let n = 3;
  const step = () => {
    if (!gameEl.classList.contains('on')) return;
    if (n === 0){ gcover.hidden = true; startGame(); return; }
    cover(`<div class="gcount">${n}</div>`);
    beep(420 + (3 - n) * 140, .14, 'square', .07);
    n--; setTimeout(step, 650);
  };
  step();
}
function clearField(){ G.items.forEach(o => o.el.remove()); G.items = []; gfield.innerHTML = ''; }
function startGame(){
  clearField();
  Object.assign(G, { on:true, score:0, time:GAME.seconds, combo:0, target:null, spawnT:0, last:performance.now() });
  newTarget(); hud();
  G.timer = setInterval(() => {
    G.time--; hud();
    if (G.time <= 5 && G.time > 0) beep(950, .06, 'square', .06);
    if (G.time <= 0) endGame();
  }, 1000);
  G.raf = requestAnimationFrame(gloop);
}
function stopGame(){ G.on = false; clearInterval(G.timer); cancelAnimationFrame(G.raf); }

function spawn(){
  const FW = gfield.clientWidth, FH = gfield.clientHeight;
  let kind = 'cat', c;
  const r = Math.random();
  if (G.force){ c = G.target; G.force = false; }
  else if (r < .06) kind = 'gold';
  else if (r < .42) c = G.target;
  else { do { c = pick(POOL); } while (POOL.length > 1 && c === G.target); }
  const d = Math.round(Math.max(64, Math.min(100, FW * .21)));
  const el = document.createElement('button');
  el.type = 'button';
  el.className = 'gb' + (kind === 'gold' ? ' gold' : '');
  el.style.cssText = `width:${d}px;height:${d}px;--d:${d}px;--c:${kind === 'gold' ? '#141414' : c.color}`;
  el.innerHTML = `<span aria-hidden="true">${kind === 'gold' ? '⭐' : c.emoji}</span>`;
  el.setAttribute('aria-label', kind === 'gold' ? 'نجمة ذهبية' : c.name);
  const prog = 1 - G.time / GAME.seconds;
  const o = { el, c, kind, d, bx: d/2 + Math.random() * Math.max(1, FW - d), y: FH + d/2,
              vy: -(75 + Math.random() * 55 + prog * 120) * (kind === 'gold' ? 1.6 : 1),
              ph: Math.random() * 6.28, sw: 12 + Math.random() * 22, dead:false };
  o.x = o.bx;
  el.addEventListener('pointerdown', e => { e.preventDefault(); hit(o); });
  el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); hit(o); } });
  gfield.appendChild(el); G.items.push(o);
}
function burst(o, colors){
  for (let i = 0; i < 10; i++){
    const s = document.createElement('div'); s.className = 'gspark';
    const a = Math.random() * 6.28, dist = 34 + Math.random() * 40;
    s.style.left = (o.x - 5) + 'px'; s.style.top = (o.y - 5) + 'px';
    s.style.background = colors[i % colors.length];
    s.style.setProperty('--dx', Math.cos(a) * dist + 'px'); s.style.setProperty('--dy', Math.sin(a) * dist + 'px');
    gfield.appendChild(s); setTimeout(() => s.remove(), 520);
  }
}
function floatTxt(o, txt, cls){
  const f = document.createElement('div'); f.className = 'gfloat ' + (cls || '');
  f.textContent = txt; f.style.left = (o.x - 24) + 'px'; f.style.top = (o.y - o.d/2 - 10) + 'px';
  gfield.appendChild(f); setTimeout(() => f.remove(), 820);
}
function pop(o){ o.dead = true; o.el.remove(); }
function hit(o){
  if (o.dead || !G.on) return;
  if (o.kind === 'gold'){
    G.score += 5; floatTxt(o, '+5', 'gold'); burst(o, ['#ffe11a', '#ff7518', '#fff']);
    beep(880, .2, 'triangle', .15); buzz(25); pop(o);
  } else if (o.c === G.target){
    G.combo = Math.min(5, G.combo + 1);
    G.score += G.combo;
    floatTxt(o, G.combo > 1 ? `+${G.combo} 🔥` : '+1');
    burst(o, [o.c.color, '#ffe11a', '#fff']);
    beep(500 + G.combo * 90, .1, 'sine', .15); buzz(10);
    pop(o); newTarget();
  } else {
    G.combo = 0; G.score = Math.max(0, G.score - 1);
    floatTxt(o, '−1', 'neg');
    o.el.classList.remove('wrong'); void o.el.offsetWidth; o.el.classList.add('wrong');
    beep(150, .22, 'sawtooth', .1); buzz([30, 40, 30]);
  }
  hud();
}
function gloop(now){
  if (!G.on) return;
  const dt = Math.min(.033, (now - G.last) / 1000); G.last = now;
  const prog = 1 - G.time / GAME.seconds;
  G.spawnT -= dt;
  if (G.spawnT <= 0){ spawn(); G.spawnT = .7 - prog * .32; }
  const FH = gfield.clientHeight;
  for (const o of G.items){
    if (o.dead) continue;
    o.y += o.vy * dt;
    o.x = o.bx + Math.sin(now / 520 + o.ph) * o.sw;
    o.el.style.transform = `translate(${o.x - o.d/2}px,${o.y - o.d/2}px)`;
    if (o.y < -o.d) pop(o);
  }
  G.items = G.items.filter(o => !o.dead);
  // إذا الصنف المطلوب مو موجود بالشاشة، طلّعه قريب
  if (!G.items.some(o => o.c === G.target && o.y < FH)) G.force = true;
  G.raf = requestAnimationFrame(gloop);
}
function endGame(){
  stopGame(); clearField();
  const best = bestScore(), isBest = G.score > best;
  if (isBest) saveBest(G.score);
  const won = GAME.reward.score > 0 && G.score >= GAME.reward.score;
  if (won || isBest) [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, .15, 'triangle', .12), i * 120));
  cover(`
    <div class="gcard">
      <h2>${won ? 'بطل!' : isBest ? 'رقم قياسي جديد' : 'خلص الوقت'}</h2>
      <div class="gbig">${G.score}</div>
      <p>${isBest ? 'أعلى نتيجة على هذا الجهاز 🏆' : 'أعلى نتيجة: ' + best}</p>
      ${won ? `<div class="greward">${GAME.reward.text}</div>`
            : GAME.reward.score > 0 ? `<p>اجمع ${GAME.reward.score} نقطة وتطلعلك هدية 🎁</p>` : ''}
      <div class="gbtns">
        <button class="gbtn" type="button" id="gagain">العب مرة ثانية</button>
        <button class="gbtn alt" type="button" id="gback2">رجوع للمنيو</button>
      </div>
    </div>`);
  $g('gagain').onclick = countdown;
  $g('gback2').onclick = closeGame;
}
function openGame(){
  POOL = makePool();
  paused = true;
  G.score = 0; G.time = GAME.seconds; G.combo = 0; hud();
  gameEl.classList.add('on');
  intro();
}
function closeGame(){
  stopGame(); clearField(); gcover.hidden = true;
  gameEl.classList.remove('on');
  paused = !panel.hidden;
  $g('gfab').focus({preventScroll:true});
}
$g('gfab').addEventListener('click', openGame);
$g('gx').addEventListener('click', closeGame);
$g('gmute').addEventListener('click', () => { gMuted = !gMuted; $g('gmute').textContent = gMuted ? '🔇' : '🔊'; });
addEventListener('keydown', e => { if (e.key === 'Escape' && gameEl.classList.contains('on')) closeGame(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && G.on){ clearInterval(G.timer); cancelAnimationFrame(G.raf); G.on = false; G.paused = true; }
  else if (!document.hidden && G.paused){ G.paused = false; G.on = true; G.last = performance.now();
    G.timer = setInterval(() => { G.time--; hud(); if (G.time <= 0) endGame(); }, 1000); G.raf = requestAnimationFrame(gloop); }
});

/* ======================================================
   ✏️ لوحة التعديل
   تنفتح بالضغط المطوّل على الشعار (ثانية ونص) ثم الرمز
   ====================================================== */
const DEFAULT_PIN = '1234';   // الرمز الافتراضي، ويتغير من داخل لوحة التعديل
const adminPin = () => String(DATA.pin || DEFAULT_PIN);
const IMG_SIZE = { cat: 480, item: 360, logo: 600 };   // أقصى أبعاد الصور بالبكسل

const GROUPS = [['food','الأكل'],['drinks','المشروبات'],['sweets','الحلويات']];
const $a = id => document.getElementById(id);
const adminEl = $a('admin'), abody = $a('abody'), afile = $a('afile');
let aGroup = 'food', aOpen = new Set(), dirty = !!window.__draftUsed, pendingImg = null, saveT = null, draftFail = false;

const escA = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kb = d => Math.round((d || '').length * .75 / 1024);
const thumb = (img, emoji, color, cls = '') =>
  `<div class="athumb ${cls}" style="--c:${escA(color || '#fff')}">${img ? `<img src="${img}" alt="">` : `<span>${escA(emoji || '🍽️')}</span>`}</div>`;

function dataJSON(){ return JSON.stringify(DATA).replace(/</g, '\\u003c'); }
function buildHTML(){
  const open = '<script type="application/json" id="menu-data">';
  const a = __SRC.indexOf(open) + open.length, b = __SRC.indexOf('</' + 'script>', a);
  return __SRC.slice(0, a) + dataJSON() + __SRC.slice(b);
}
function info(){
  const mb = (buildHTML().length / 1048576).toFixed(2);
  const imgs = DATA.cats.reduce((n, c) => n + (c.img ? 1 : 0) + c.items.filter(i => i.img).length, 0);
  $a('ainfo').innerHTML =
    `<span>حجم الملف: <b>${mb} MB</b></span><span>الصور: <b>${imgs}</b></span>` +
    (dirty ? `<span class="warn">● فيه تعديلات ما نزّلتها بعد</span>` : `<span class="ok">● الملف محدّث</span>`) +
    (draftFail ? `<span class="warn">المسودة كبيرة وما انحفظت بالمتصفح، نزّل الملف قبل لا تسكّر</span>` : '') +
    (window.__draftUsed || dirty ? `<button class="abtn sm" type="button" data-act="discard">تراجع عن كل التعديلات</button>` : '');
}
function markDirty(){
  dirty = true; info();
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ base: DATA_SIG, data: DATA })); draftFail = false; }
    catch (e) { draftFail = true; }
    info();
  }, 600);
}

function itemHTML(c, ci, it, ii){
  return `
  <div class="aitem${it.off ? ' off' : ''}" data-c="${ci}" data-i="${ii}">
    <div class="ahead">
      ${thumb(it.img, it.emoji || c.emoji, c.color)}
      <div class="aname">${escA(it.name) || '—'}<small>${it.img ? 'صورة ' + kb(it.img) + ' KB' : 'بدون صورة'}</small></div>
      <div class="acts">
        <button class="abtn sm" type="button" data-act="iup" aria-label="فوق">▲</button>
        <button class="abtn sm" type="button" data-act="idown" aria-label="جوه">▼</button>
      </div>
    </div>
    <div class="afields">
      <label>الاسم<input data-f="name" value="${escA(it.name)}"></label>
      <label>بالإنكليزي<input data-f="en" dir="ltr" value="${escA(it.en)}"></label>
      <label class="full">الوصف<textarea data-f="desc" rows="2" placeholder="اختياري">${escA(it.desc)}</textarea></label>
      <label>السعر (د.ع)<input data-f="price" type="number" inputmode="numeric" min="0" step="250" value="${it.price ?? 0}"></label>
      <label>الأيقونة<input data-f="emoji" value="${escA(it.emoji)}" placeholder="${escA(c.emoji)}"></label>
      <label class="chk full"><input data-f="off" type="checkbox" ${it.off ? 'checked' : ''}>غير متوفر حالياً</label>
    </div>
    <div class="aimg">
      <button class="abtn sm" type="button" data-act="img">📷 ${it.img ? 'تغيير الصورة' : 'رفع صورة'}</button>
      ${it.img ? `<button class="abtn sm" type="button" data-act="rmimg">حذف الصورة</button>` : ''}
      <span style="flex:1"></span>
      <button class="abtn sm danger" type="button" data-act="idel">حذف الطبق</button>
    </div>
  </div>`;
}
function catHTML(c, ci){
  return `
  <details class="acat" data-c="${ci}" data-id="${escA(c.id)}" ${aOpen.has(c.id) ? 'open' : ''}>
    <summary>
      ${thumb(c.img, c.emoji, c.color)}
      <div class="aname"><span class="cname">${escA(c.name) || '—'}</span><small>${c.items.length} طبق${c.img ? ' · صورة ' + kb(c.img) + ' KB' : ''}</small></div>
      <div class="acts">
        <button class="abtn sm" type="button" data-act="up" aria-label="فوق">▲</button>
        <button class="abtn sm" type="button" data-act="down" aria-label="جوه">▼</button>
      </div>
    </summary>
    <div class="afields">
      <label>اسم الصنف<input data-f="name" value="${escA(c.name)}"></label>
      <label>بالإنكليزي<input data-f="en" dir="ltr" value="${escA(c.en)}"></label>
      <label>الأيقونة<input data-f="emoji" value="${escA(c.emoji)}"></label>
      <label>اللون<input data-f="color" type="color" value="${escA(c.color)}"></label>
      <label class="full">القسم<select data-f="group">${GROUPS.map(([g, n]) => `<option value="${g}" ${c.group === g ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
    </div>
    <div class="aimg">
      <button class="abtn sm" type="button" data-act="img">📷 ${c.img ? 'تغيير صورة الصنف' : 'رفع صورة للصنف'}</button>
      ${c.img ? `<button class="abtn sm" type="button" data-act="rmimg">حذف الصورة</button>` : ''}
    </div>
    <div class="aitems">${c.items.map((it, ii) => itemHTML(c, ci, it, ii)).join('')}</div>
    <div class="aimg">
      <button class="abtn sm primary" type="button" data-act="additem">+ طبق جديد</button>
      <span style="flex:1"></span>
      <button class="abtn sm danger" type="button" data-act="del">حذف الصنف كامل</button>
    </div>
  </details>`;
}
function renderAdmin(){
  const y = adminEl.scrollTop;
  abody.innerHTML = `
    <div class="acard">
      <h3>الشعار</h3>
      <div class="aimg" style="margin:0">
        ${thumb(DATA.logo, '🍟', '#fff', 'logo')}
        <button class="abtn sm" type="button" data-act="logo">📷 تغيير الشعار</button>
        <small>${kb(DATA.logo)} KB</small>
      </div>
    </div>
    <div class="acard">
      <h3>رمز دخول الإدارة</h3>
      <div class="afields" style="margin:0">
        <label class="full">الرمز الجديد (٤ أرقام أو أكثر)<input id="pinset" inputmode="numeric" autocomplete="off" value="${escA(adminPin())}" dir="ltr" style="text-align:center;letter-spacing:.2em"></label>
      </div>
      <small id="pinmsg" style="font-weight:700;color:var(--muted)">الرمز الجديد يشتغل بعد ما تنزّل الملف وترفعه</small>
    </div>
    <div class="atabs">${GROUPS.map(([g, n]) => `<button type="button" data-act="grp" data-g="${g}" aria-pressed="${aGroup === g}">${n}</button>`).join('')}</div>
    ${DATA.cats.map((c, ci) => c.group === aGroup ? catHTML(c, ci) : '').join('')}
    <button class="abtn primary" type="button" data-act="addcat" style="justify-self:center;font-size:1.05rem;padding:6px 22px">+ صنف جديد</button>`;
  adminEl.scrollTop = y;
  info();
}

/* نقل عنصر داخل قائمة بنفس القسم */
function moveCat(ci, dir){
  const cats = DATA.cats, g = cats[ci].group;
  let j = ci + dir;
  while (j >= 0 && j < cats.length && cats[j].group !== g) j += dir;
  if (j < 0 || j >= cats.length) return;
  [cats[ci], cats[j]] = [cats[j], cats[ci]];
}
function swap(arr, i, j){ if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; }

abody.addEventListener('input', e => {
  if (e.target.id === 'pinset'){
    const v = e.target.value.trim(), m = $a('pinmsg');
    if (v.length < 4){ m.textContent = 'الرمز لازم يكون ٤ أرقام أو حروف على الأقل'; m.style.color = '#d6402b'; return; }
    DATA.pin = v; m.textContent = 'الرمز الجديد يشتغل بعد ما تنزّل الملف وترفعه'; m.style.color = '';
    markDirty(); return;
  }
  const f = e.target.dataset.f; if (!f) return;
  const box = e.target.closest('[data-c]'), c = DATA.cats[+box.dataset.c];
  const ii = box.dataset.i, obj = ii !== undefined ? c.items[+ii] : c;
  if (f === 'group') return;
  if (f === 'price') obj.price = Math.max(0, +e.target.value || 0);
  else if (f === 'off'){ obj.off = e.target.checked; box.classList.toggle('off', obj.off); }
  else obj[f] = e.target.value.trim() ? e.target.value : '';
  if (f === 'name'){
    const n = ii !== undefined ? box.querySelector('.aname') : box.querySelector('.cname');
    if (n) n.firstChild.textContent = e.target.value || '—';
  }
  if (f === 'color') box.querySelectorAll('.athumb').forEach(t => t.style.setProperty('--c', e.target.value));
  markDirty();
});
abody.addEventListener('change', e => {
  if (e.target.dataset.f !== 'group') return;
  const c = DATA.cats[+e.target.closest('[data-c]').dataset.c];
  c.group = e.target.value; aGroup = c.group; aOpen.add(c.id);
  markDirty(); renderAdmin();
});
abody.addEventListener('toggle', e => {
  const d = e.target; if (!d.classList || !d.classList.contains('acat')) return;
  d.open ? aOpen.add(d.dataset.id) : aOpen.delete(d.dataset.id);
}, true);

abody.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  e.preventDefault();
  const act = b.dataset.act, box = b.closest('[data-c]');
  const ci = box ? +box.dataset.c : -1, c = DATA.cats[ci];
  const ii = box && box.dataset.i !== undefined ? +box.dataset.i : -1;
  switch (act){
    case 'grp': aGroup = b.dataset.g; renderAdmin(); return;
    case 'discard':
      if (!confirm('ترجع المنيو مثل ما هو بالملف وتنحذف كل التعديلات؟')) return;
      try { localStorage.removeItem(DRAFT_KEY); } catch (er) {}
      DATA = JSON.parse(ORIGINAL_JSON); CATS = DATA.cats; window.__draftUsed = false; dirty = false;
      applyLogo(); renderAdmin(); return;
    case 'logo': pendingImg = { kind: 'logo' }; afile.value = ''; afile.click(); return;
    case 'img': pendingImg = ii >= 0 ? { kind: 'item', ci, ii } : { kind: 'cat', ci }; afile.value = ''; afile.click(); return;
    case 'rmimg':
      if (!confirm('تحذف الصورة؟')) return;
      (ii >= 0 ? c.items[ii] : c).img = ''; break;
    case 'up': case 'down': moveCat(ci, act === 'up' ? -1 : 1); break;
    case 'iup': case 'idown': swap(c.items, ii, ii + (act === 'iup' ? -1 : 1)); break;
    case 'idel':
      if (!confirm(`تحذف "${c.items[ii].name}"؟`)) return;
      c.items.splice(ii, 1); break;
    case 'del':
      if (!confirm(`تحذف صنف "${c.name}" وكل أطباقه (${c.items.length})؟`)) return;
      DATA.cats.splice(ci, 1); break;
    case 'additem':
      c.items.push({ name: 'طبق جديد', en: '', desc: '', price: 0, emoji: '', off: false, img: '' }); break;
    case 'addcat': {
      const id = 'c' + Date.now().toString(36);
      DATA.cats.push({ id, group: aGroup, name: 'صنف جديد', en: '', emoji: '🍽️', color: '#ffe11a', img: '', items: [] });
      aOpen.add(id); break;
    }
    default: return;
  }
  markDirty(); renderAdmin();
});

/* ضغط الصورة وتحويلها base64 */
function compress(file, max, square, keepAlpha){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      let sw = im.naturalWidth, sh = im.naturalHeight, sx = 0, sy = 0;
      if (square){ const s = Math.min(sw, sh); sx = (sw - s) / 2; sy = (sh - s) / 2; sw = sh = s; }
      const k = Math.min(1, max / Math.max(sw, sh)), w = Math.round(sw * k), h = Math.round(sh * k);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const cx = cv.getContext('2d');
      if (!keepAlpha){ cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); }
      cx.imageSmoothingQuality = 'high';
      cx.drawImage(im, sx, sy, sw, sh, 0, 0, w, h);
      let d = cv.toDataURL('image/webp', .8);
      if (!d.startsWith('data:image/webp')) d = keepAlpha ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', .82);
      URL.revokeObjectURL(url); res(d);
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); };
    im.src = url;
  });
}
afile.addEventListener('change', async () => {
  const f = afile.files[0], p = pendingImg; pendingImg = null;
  if (!f || !p) return;
  $a('abusy').hidden = false;
  try {
    if (p.kind === 'logo'){ DATA.logo = await compress(f, IMG_SIZE.logo, false, true); applyLogo(); }
    else if (p.kind === 'cat') DATA.cats[p.ci].img = await compress(f, IMG_SIZE.cat, true, false);
    else DATA.cats[p.ci].items[p.ii].img = await compress(f, IMG_SIZE.item, true, false);
    markDirty(); renderAdmin();
  } catch (er) { alert('ما كدرت أقرا الصورة، جرّب صورة JPG أو PNG'); }
  $a('abusy').hidden = true;
});

/* تنزيل الملف الجديد */
$a('aexport').addEventListener('click', () => {
  const blob = new Blob([buildHTML()], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'index.html';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
  dirty = false; info();
});

function showAdmin(){
  if (location.hash) location.hash = '';
  aGroup = group; paused = true;
  adminEl.hidden = false; renderAdmin(); adminEl.scrollTop = 0;
}
function openAdmin(){
  let ok = false;
  try { ok = sessionStorage.getItem('fd_admin') === '1'; } catch (e) {}
  if (ok){ showAdmin(); return; }
  $a('pinin').value = ''; $a('pinerr').textContent = '';
  $a('pinbox').hidden = false;
  setTimeout(() => $a('pinin').focus(), 50);
}
function closePin(){ $a('pinbox').hidden = true; }
$a('pinform').addEventListener('submit', e => {
  e.preventDefault();
  if ($a('pinin').value.trim() === adminPin()){
    try { sessionStorage.setItem('fd_admin', '1'); } catch (er) {}
    closePin(); showAdmin();
  } else {
    $a('pinerr').textContent = 'الرمز غلط، جرّب مرة ثانية';
    const c = $a('pinform'); c.classList.remove('pinshake'); void c.offsetWidth; c.classList.add('pinshake');
    $a('pinin').select(); buzz(60);
  }
});
$a('pincancel').addEventListener('click', closePin);
$a('pinbox').addEventListener('click', e => { if (e.target.id === 'pinbox') closePin(); });
$a('admbtn').addEventListener('click', openAdmin);
function closeAdmin(){
  adminEl.hidden = true;
  if (!CATS.some(c => c.group === group)) group = 'food';
  setGroup(group); paused = false;
}
$a('aclose').addEventListener('click', closeAdmin);
addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (!$a('pinbox').hidden) closePin(); else if (!adminEl.hidden) closeAdmin(); });
addEventListener('beforeunload', e => { if (dirty && !adminEl.hidden){ e.preventDefault(); e.returnValue = ''; } });

/* ضغط مطوّل على الشعار */
(() => {
  const logo = document.querySelector('.logo'); let t = null;
  const cancel = () => { clearTimeout(t); t = null; };
  logo.addEventListener('pointerdown', () => { cancel(); t = setTimeout(() => { t = null; openAdmin(); }, 1500); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => logo.addEventListener(ev, cancel));
  logo.addEventListener('contextmenu', e => e.preventDefault());
})();
</script></body></html>
