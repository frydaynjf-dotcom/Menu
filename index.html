<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRY DAY | قريباً</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Baloo+2:wght@600;700;800&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    height: 100%;
    background: radial-gradient(circle at 50% 30%, #1a2540 0%, #0d1526 55%, #060a14 100%);
    overflow: hidden;
    font-family: 'Tajawal', sans-serif;
  }

  .stage {
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .glow {
    position: absolute;
    width: 60vmin;
    height: 60vmin;
    background: radial-gradient(circle, rgba(255,200,40,0.28) 0%, rgba(255,120,40,0.12) 40%, transparent 70%);
    filter: blur(10px);
    animation: pulse 3.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(0.92); opacity: 0.7; }
    50%      { transform: scale(1.08); opacity: 1; }
  }

  .logo-wrap {
    position: relative;
    z-index: 2;
    width: min(46vw, 340px);
    animation: entrance 1.1s cubic-bezier(.2,.9,.25,1.15);
    filter: drop-shadow(0 18px 30px rgba(0,0,0,0.55));
  }

  .logo-wrap img.base-logo {
    width: 100%;
    display: block;
  }

  /* the flame sits precisely over its cut-out area on the base logo */
  .flame-layer {
    position: absolute;
    left: 20.5128%;
    top: 0%;
    width: 40%;
    height: 42.2607%;
    transform-origin: 50% 100%; /* anchor at its base so only the tips flicker */
    animation: flicker 1.8s ease-in-out infinite;
  }

  .flame-layer img {
    width: 100%;
    height: 100%;
    display: block;
  }

  @keyframes flicker {
    0%   { transform: scale(1, 1) skewX(0deg) rotate(0deg); }
    20%  { transform: scale(1.03, 0.97) skewX(1.5deg) rotate(0.8deg); }
    40%  { transform: scale(0.97, 1.04) skewX(-1deg) rotate(-1deg); }
    60%  { transform: scale(1.04, 0.96) skewX(1deg) rotate(1.2deg); }
    80%  { transform: scale(0.98, 1.03) skewX(-1.5deg) rotate(-0.6deg); }
    100% { transform: scale(1, 1) skewX(0deg) rotate(0deg); }
  }

  @keyframes entrance {
    0%   { transform: scale(0.3) rotate(-10deg); opacity: 0; }
    60%  { transform: scale(1.08) rotate(2deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .text-block {
    z-index: 2;
    text-align: center;
    margin-top: 34px;
    opacity: 0;
    animation: fadeUp 1s ease forwards;
    animation-delay: 0.7s;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .arabic {
    font-family: 'Tajawal', sans-serif;
    font-weight: 900;
    font-size: clamp(28px, 6vw, 44px);
    color: #ffd93d;
    letter-spacing: 1px;
    text-shadow: 0 0 18px rgba(255,217,61,0.55), 0 4px 10px rgba(0,0,0,0.5);
  }

  .dots span {
    display: inline-block;
    animation: blink 1.4s infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; }
    40% { opacity: 1; }
  }

  .english {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: clamp(13px, 2.6vw, 18px);
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #6fb3ff;
    margin-top: 10px;
  }

  .underline {
    width: 60px;
    height: 3px;
    margin: 16px auto 0;
    background: linear-gradient(90deg, #ffd93d, #ff7a2f);
    border-radius: 3px;
    opacity: 0;
    animation: growLine 0.8s ease forwards;
    animation-delay: 1.1s;
  }

  @keyframes growLine {
    from { width: 0; opacity: 0; }
    to   { width: 60px; opacity: 1; }
  }

  .ember {
    position: absolute;
    bottom: -10px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffd93d 0%, #ff7a2f 60%, transparent 80%);
    opacity: 0.75;
    animation: rise linear infinite;
  }

  @keyframes rise {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    10%  { opacity: 0.8; }
    100% { transform: translateY(-100vh) translateX(var(--drift, 20px)); opacity: 0; }
  }

</style>
</head>

<script>
  const container = document.getElementById('embers');
  const count = 18;
  for (let i = 0; i < count; i++) {
    const e = document.createElement('div');
    e.className = 'ember';
    const size = 3 + Math.random() * 6;
    e.style.width = size + 'px';
    e.style.height = size + 'px';
    e.style.left = Math.random() * 100 + 'vw';
    e.style.setProperty('--drift', (Math.random() * 60 - 30) + 'px');
    e.style.animationDuration = (5 + Math.random() * 6) + 's';
    e.style.animationDelay = (Math.random() * 8) + 's';
    container.appendChild(e);
  }

  /* ---- Procedural wood-fire crackle sound (Web Audio API, no external files) ----
     Warm, soft campfire character: quiet low hiss bed + gentle, irregularly
     spaced wood-pop crackles (not a dense harsh click-storm). */
  let audioCtx = null;
  let fireNodes = null;

  function buildFire(ctx) {
    // soft warm hiss bed, very quiet, mid-range (not hissy/harsh highs)
    const bufSize = ctx.sampleRate * 3;
    const noiseBuf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

    const noiseSrc = ctx.createBufferSource();
    noiseSrc.buffer = noiseBuf;
    noiseSrc.loop = true;

    const lowpass = ctx.createBiquadFilter();
    lowpass.type = 'lowpass';
    lowpass.frequency.value = 1100; // warm, not hissy
    lowpass.Q.value = 0.5;

    const highpass = ctx.createBiquadFilter();
    highpass.type = 'highpass';
    highpass.frequency.value = 250;

    const hissGain = ctx.createGain();
    hissGain.gain.value = 0.02; // very subtle bed, just a warm presence

    // slow gentle flutter so the bed breathes a little
    const flutter = ctx.createOscillator();
    flutter.type = 'sine';
    flutter.frequency.value = 0.35;
    const flutterGain = ctx.createGain();
    flutterGain.gain.value = 0.006;
    flutter.connect(flutterGain);
    flutterGain.connect(hissGain.gain);
    flutter.start();

    noiseSrc.connect(highpass);
    highpass.connect(lowpass);
    lowpass.connect(hissGain);

    const master = ctx.createGain();
    master.gain.value = 0.8;
    hissGain.connect(master);
    master.connect(ctx.destination);

    noiseSrc.start();

    // gentle, irregularly-spaced wood pops with natural pauses between
    let crackleTimer = null;
    function schedulePop() {
      // longer, uneven gaps so it doesn't sound like a machine-gun of clicks
      const delay = 220 + Math.random() * 900;
      crackleTimer = setTimeout(() => {
        firePop(ctx, master);
        // occasionally a tiny cluster of 2-3 pops, like a log settling
        if (Math.random() > 0.75) {
          setTimeout(() => firePop(ctx, master), 40 + Math.random() * 60);
        }
        if (Math.random() > 0.9) {
          setTimeout(() => firePop(ctx, master), 100 + Math.random() * 80);
        }
        schedulePop();
      }, delay);
    }
    schedulePop();

    return {
      master,
      stop() {
        clearTimeout(crackleTimer);
        try { noiseSrc.stop(); flutter.stop(); } catch (e) {}
      }
    };
  }

  function firePop(ctx, destination) {
    const dur = 0.05 + Math.random() * 0.07; // softer, slightly longer than a click
    const bufSize = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufSize, 1.6);
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;

    // warm wood pop: mid-low resonance, not a sharp high click
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 500 + Math.random() * 1200;
    bp.Q.value = 0.9;

    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 2600;

    const g = ctx.createGain();
    const vol = 0.14 + Math.random() * 0.18;
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(vol, ctx.currentTime + 0.004);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);

    src.connect(bp);
    bp.connect(lp);
    lp.connect(g);
    g.connect(destination);
    src.start();
  }

  // Browsers block audio until the user interacts with the page at least
  // once — there is no visible button, sound simply unlocks silently on
  // the first tap/click/key anywhere on the page.
  function unlockAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    fireNodes = buildFire(audioCtx);
    if (audioCtx.state === 'suspended') audioCtx.resume();
    ['pointerdown', 'keydown', 'touchstart'].forEach(ev =>
      document.removeEventListener(ev, unlockAudio)
    );
  }
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev =>
    document.addEventListener(ev, unlockAudio, { once: false })
  );
</script>
</body>
</html>
